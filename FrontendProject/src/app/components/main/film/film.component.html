    <h1>Film</h1>

<div class="container mat-elevation-z8" style="padding: 15px;">
  
  <div style="margin-bottom: 15px;">
    <button class="krug-dugme" mat-raised-button color="primary" (click)="otvoriDialog(1)">
      <mat-icon>add</mat-icon></button>
  </div>
   <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;">

<mat-form-field  appearance="outline" style="flex: 1; min-width: 200px;">
<input matInput
#naziv
(keyup)="pretraziNaziv(naziv.value)"
placeholder="Pretraži naziv">
</mat-form-field>


<mat-form-field  appearance="outline" style="flex: 1; min-width: 200px;">
<input matInput
#zanr
(keyup)="pretraziZanr(zanr.value)"
placeholder="Pretraži žanr">
</mat-form-field>


<mat-form-field  appearance="outline" style="flex: 1; min-width: 200px;">
<input matInput #recenzija type="number" min="1" max="10"
(keyup)="pretraziRecenziju(recenzija.value)"
placeholder="Recenzija veća od">
</mat-form-field>
</div>
  <table mat-table [dataSource]="dataSource" matSort #sortFilm="matSort" style="width: 100%;">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="naziv">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Naziv filma </th>
      <td mat-cell *matCellDef="let element"> {{element.naziv}} </td>
    </ng-container>

    <ng-container matColumnDef="zanr">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Žanr </th>
      <td mat-cell *matCellDef="let element"> {{element.zanr}} </td>
    </ng-container>

    <ng-container matColumnDef="trajanje">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Trajanje (min) </th>
      <td mat-cell *matCellDef="let element"> {{element.trajanje}} </td>
    </ng-container>

    <ng-container matColumnDef="recenzija">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Recenzija </th>
      <td mat-cell *matCellDef="let element"> {{element.recenzija}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Akcije </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="accent" (click)="$event.stopPropagation(); otvoriDialog(2, element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="$event.stopPropagation(); otvoriDialog(3, element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="tabela-red"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
