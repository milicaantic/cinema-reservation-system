<div class="container">
  <h3 mat-dialog-title *ngIf="flag === 1">Dodavanje filma</h3>
  <h3 mat-dialog-title *ngIf="flag === 2">Modifikacija filma: {{data.id}}</h3>
  <h3 mat-dialog-title *ngIf="flag === 3">Brisanje filma: {{data.id}}</h3>

  <div mat-dialog-content>
    <form #forma="ngForm">
      
      <mat-form-field style="width: 100%; margin-bottom: 10px;">
        <mat-label>Naziv filma</mat-label>
<input matInput [(ngModel)]="data.naziv" name="naziv" [disabled]="flag === 3"
       required minlength="2" maxlength="100">
      </mat-form-field>

      <mat-form-field style="width: 100%; margin-bottom: 10px;">
        <mat-label>Žanr</mat-label>
<input matInput [(ngModel)]="data.zanr" name="zanr" [disabled]="flag === 3"
       required minlength="2" maxlength="50">      </mat-form-field>

      <mat-form-field style="width: 100%; margin-bottom: 10px;">
        <mat-label>Trajanje (min)</mat-label>
<input matInput type="number" [(ngModel)]="data.trajanje" name="trajanje" [disabled]="flag === 3"
       required min="1" max="600">
            </mat-form-field>

      <mat-form-field style="width: 100%; margin-bottom: 10px;">
        <mat-label>Recenzija</mat-label>
<input matInput type="number" [(ngModel)]="data.recenzija" name="recenzija" [disabled]="flag === 3"
       required min="1" max="10">
            </mat-form-field>

    </form>
  </div>

  <div mat-dialog-actions style="display: flex; justify-content: flex-end; gap: 10px; padding: 15px 0;">
    <button mat-raised-button *ngIf="flag !== 3" color="primary" [disabled]="!forma.valid" (click)="proveriLogiku()">Sačuvaj</button>
    <button mat-raised-button *ngIf="flag === 3" color="warn" (click)="proveriLogiku()">Obriši</button>
    <button mat-button (click)="ponisti()">Poništi</button>
  </div>
</div>
