<div class="container">
  <h3 mat-dialog-title *ngIf="flag === 1">Dodavanje sale</h3>
  <h3 mat-dialog-title *ngIf="flag === 2">Modifikacija sale: {{data.id}}</h3>
  <h3 mat-dialog-title *ngIf="flag === 3">Brisanje sale: {{data.id}}</h3>

  <div mat-dialog-content>
    <form #forma="ngForm">
      
      <mat-form-field style="width: 100%; margin-bottom: 10px;">
        <input matInput type="number" placeholder="Kapacitet" [(ngModel)]="data.kapacitet" name="kapacitet" [disabled]="flag === 3" required>
      </mat-form-field>

      <mat-form-field style="width: 100%; margin-bottom: 10px;">
        <input matInput type="number" placeholder="Broj redova" [(ngModel)]="data.brojRedova" name="brojRedova" [disabled]="flag === 3" required>
      </mat-form-field>

      <mat-form-field style="width: 100%; margin-bottom: 10px;">
        <mat-label>Bioskop</mat-label>
        <mat-select [(ngModel)]="data.bioskop" name="bioskop" [compareWith]="compareObjects" [disabled]="flag === 3" required>
          <mat-option *ngFor="let b of bioskopi" [value]="b">
            {{b.naziv}}
          </mat-option>
        </mat-select>
      </mat-form-field>

    </form>
  </div>

  <div mat-dialog-actions style="display: flex; justify-content: flex-end; gap: 10px; padding: 15px 0;">
    <button mat-raised-button *ngIf="flag !== 3" color="primary" [disabled]="!forma.valid" (click)="proveriLogiku()">Sačuvaj</button>
    <button mat-raised-button *ngIf="flag === 3" color="warn" (click)="proveriLogiku()">Obriši</button>
    <button mat-button (click)="ponisti()">Poništi</button>
  </div>
</div>
